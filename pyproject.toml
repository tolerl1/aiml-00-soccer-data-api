[project]
name = "aiml-00-soccer-data-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "soccerdata>=1.9.1",
    "statsbombpy>=1.22.0",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = ["ruff>=0.14.0"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
